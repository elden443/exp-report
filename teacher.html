<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教师端 - 实验报告管理系统</title>
    <link rel="stylesheet" href="CSS/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="xlsx.min.js"></script>
</head>
<body>
    <div class="header">
        <h2>实验报告管理系统</h2>
        <div>
            <span id="userInfo"></span>
            <button onclick="logout()">退出</button>
        </div>
    </div>

    <div class="container">
        <div class="btn-group">
            <button onclick="showCreateCourse()">创建课程</button>
            <button onclick="showImport()">导入Excel</button>
        </div>

        <h3>我的课程</h3>
        <div id="courseList"></div>
    </div>

    <!-- 创建课程弹窗 -->
    <div id="createCourseModal" class="modal">
        <div class="modal-content">
            <h3>创建课程</h3>
            <form id="createCourseForm">
                <input type="text" id="courseName" placeholder="请输入课程名称" required>
                <div class="btn-group">
                    <button type="button" onclick="closeModal()">取消</button>
                    <button type="submit">创建</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 导入Excel弹窗 -->
    <div id="importModal" class="modal">
        <div class="modal-content">
            <h3>导入学生和实验项目</h3>
            <select id="courseSelect" required>
                <option value="">请选择课程</option>
            </select>
            <input type="file" id="excelFile" accept=".xlsx,.xls" required>
            <p>Excel格式要求：<br>
               第1列：序号（随便填数字）<br>
               第2列：学号（SNO）<br>
               第3列：姓名（Sname）<br>
               第4列及以后：实验项目名称</p>
            <div class="btn-group">
                <button type="button" onclick="closeModal()">取消</button>
                <button onclick="importExcel()">导入</button>
            </div>
        </div>
    </div>

    <div id="deleteModal" class="modal">
        <div class="modal-content">
            <h3>确认删除</h3>
            <p>确定要删除该课程吗？<br>
               这将同时删除该课程下的所有实验项目、学生选课记录和实验报告，且无法恢复。</p>
            <div class="btn-group">
                <button type="button" onclick="closeModal()">取消</button>
                <button type="button" class="danger" onclick="confirmDelete()">确认删除</button>
            </div>
        </div>
    </div>

    <script>

        const SUPABASE_URL = 'https://bvvbbyxedvhpsilggyyx.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_yKsNqqYsG2R9cqZUMUjDAg_YcQ7nCff';
        
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const user = JSON.parse(localStorage.getItem('user'));
        let currentDeleteCourseId = null;

        if (!user || user.role !== 'teacher') window.location.href = 'index.html';
        document.getElementById('userInfo').textContent = user.sname;

        async function loadCourses() {
            const { data: courses, error: courseError } = await sb
                .from('courses')
                .select(`
                    id, course_name,
                    experiments(
                        id, exp_name, is_open,
                        reports(count)
                    )
                `)
                .eq('teacher_id', user.id);
            
            if (courseError) {
                alert('加载课程失败：' + courseError.message);
                return;
            }

            const courseSelect = document.getElementById('courseSelect');
            courseSelect.innerHTML = '<option value="">请选择课程</option>';
            courses.forEach(course => {
                courseSelect.innerHTML += `<option value="${course.id}">${course.course_name}</option>`;
            });

            const courseList = document.getElementById('courseList');
            courseList.innerHTML = '';

            courses.forEach(course => {
                const courseDiv = document.createElement('div');
                courseDiv.className = 'course-card';
                courseDiv.innerHTML = `
                    <h4>
                        ${course.course_name}
                        <button class="danger" onclick="showDeleteConfirm('${course.id}')">删除课程</button>
                    </h4>
                `;

                if (course.experiments.length > 0) {
                    const expList = document.createElement('ul');
                    course.experiments.forEach(exp => {
                        const submittedCount = exp.reports[0]?.count || 0;
                        const li = document.createElement('li');
                        li.innerHTML = `
                            <span>${exp.exp_name}</span>
                            <span class="${exp.is_open ? 'open' : 'closed'}">
                                ${exp.is_open ? '开放中' : '已关闭'}
                            </span>
                            <span>已提交：${submittedCount}人</span>
                            <button onclick="toggleExp('${exp.id}', ${exp.is_open})">
                                ${exp.is_open ? '关闭上传' : '开放上传'}
                            </button>
                        `;
                        expList.appendChild(li);
                    });
                    courseDiv.appendChild(expList);
                } else {
                    courseDiv.innerHTML += '<p style="color: #999; padding: 12px; text-align: center;">暂无实验项目，请导入Excel</p>';
                }

                courseList.appendChild(courseDiv);
            });

            if (courses.length === 0) {
                courseList.innerHTML = '<p style="color: #999; text-align: center; padding: 40px;">暂无课程，请点击上方"创建课程"按钮</p>';
            }
        }

        async function toggleExp(expId, currentState) {
            const { error } = await sb
                .from('experiments')
                .update({ is_open: !currentState })
                .eq('id', expId);
            
            if (error) {
                alert('操作失败：' + error.message);
                return;
            }
            loadCourses();
        }

        function showCreateCourse() {
            document.getElementById('createCourseModal').style.display = 'block';
        }

        document.getElementById('createCourseForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const courseName = document.getElementById('courseName').value.trim();
            
            if (!courseName) {
                alert('请输入课程名称');
                return;
            }

            const { error } = await sb
                .from('courses')
                .insert({
                    course_name: courseName,
                    teacher_id: user.id
                });

            if (error) {
                alert('创建失败：' + error.message);
                return;
            }

            alert('课程创建成功');
            closeModal();
            loadCourses();
        });

        function showImport() {
            document.getElementById('importModal').style.display = 'block';
        }

        async function importExcel() {
            const courseId = document.getElementById('courseSelect').value;
            const file = document.getElementById('excelFile').files[0];
            
            if (!courseId) {
                alert('请先选择课程');
                return;
            }

            if (!file) {
                alert('请选择Excel文件');
                return;
            }

            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];

                    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '', blankrows: false });
                    
                    if (rows.length < 2) {
                        alert('Excel文件为空或格式错误，至少需要包含表头和一行数据');
                        return;
                    }

                    const dataRows = rows.slice(1);

                    const students = [];
                    for (const row of dataRows) {
                        if (row[1] && row[2]) { 
                            students.push({
                                username: row[1].toString().trim(),
                                password: '123456',
                                role: 'student',
                                sno: row[1].toString().trim(),
                                sname: row[2].toString().trim()
                            });
                        }
                    }

                    const expNames = [];
                    if (rows[0].length > 3) {
                        for (let i = 3; i < rows[0].length; i++) {
                            if (rows[0][i]) {
                                expNames.push(rows[0][i].toString().trim());
                            }
                        }
                    }

                    if (students.length === 0) {
                        alert('没有找到有效的学生数据');
                        return;
                    }

                    await sb.from('users').insert(students, { ignoreDuplicates: true });

                    const { data: userIds } = await sb
                        .from('users')
                        .select('id, sno')
                        .in('sno', students.map(s => s.sno));

                    const enrollments = userIds.map(u => ({
                        course_id: parseInt(courseId),
                        student_id: u.id
                    }));
                    await sb.from('enrollments').insert(enrollments, { ignoreDuplicates: true });

                    const experiments = expNames.map(name => ({
                        course_id: parseInt(courseId),
                        exp_name: name
                    }));
                    
                    if (experiments.length > 0) {
                        await sb.from('experiments').insert(experiments);
                    }

                    alert(`导入成功！\n共导入 ${students.length} 名学生\n${experiments.length > 0 ? '导入 ' + experiments.length + ' 个实验项目' : '没有导入实验项目'}`);
                    closeModal();
                    loadCourses();
                } catch (error) {
                    alert('导入失败：' + error.message);
                    console.error(error);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function showDeleteConfirm(courseId) {
            currentDeleteCourseId = courseId;
            document.getElementById('deleteModal').style.display = 'block';
        }

        async function confirmDelete() {
            if (!currentDeleteCourseId) return;

            try {
                const { error } = await sb
                    .from('courses')
                    .delete()
                    .eq('id', currentDeleteCourseId);

                if (error) {
                    alert('删除失败：' + error.message);
                    return;
                }

                alert('课程删除成功');
                closeModal();
                loadCourses();
            } catch (error) {
                alert('删除失败：' + error.message);
            }
        }

        function closeModal() {

            document.querySelectorAll('.modal').forEach(modal => {
                modal.style.display = 'none';
            });

            document.getElementById('createCourseForm').reset();
            document.getElementById('excelFile').value = '';
            currentDeleteCourseId = null;
        }

        function logout() {
            localStorage.removeItem('user');
            window.location.href = 'index.html';
        }

        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                closeModal();
            }
        }

        window.onload = loadCourses;
    </script>
</body>
</html>
